name: ci
# The test suite and clippy on every PR. The other PR workflows check flint
# against Fleet; this one checks flint against itself, including the docs
# examples (cli/tests/doc_examples.rs), so docs/ changes run it too.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install   # from rust-toolchain.toml

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ci-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
