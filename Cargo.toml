[workspace]
resolver = "2"
members = [
    "crates/flint-lint",
    "crates/flint-lsp",
    "cli",
]
exclude = [
    "editors/zed",
    "fleet-schema-gen",
]

[workspace.package]
version = "0.2.0"
edition = "2021"

# Single source of truth for dependency versions. Member crates reference
# these with `dep = { workspace = true }` (adding crate-local features where
# needed), so versions can't silently drift apart between crates.
[workspace.lints.rust]
# There is no `unsafe` in this workspace and no reason for any: the engine is
# pure parsing and comparison. Making that a lint means adding some has to be
# a deliberate, visible decision rather than a quiet one.
unsafe_code = "warn"
# NOT enabled yet: `unreachable_pub` flags ~75 rule structs that are `pub`
# inside private modules. Mechanical to fix (`pub` -> `pub(crate)`) but a
# separate pass — turning it on half-done would just train people to ignore
# the warning list.
# unreachable_pub = "warn"

[workspace.lints.clippy]
# A library that prints can only be driven by a terminal. Rendering belongs to
# the caller, so the lint crates return strings (see `LintReport::render`) and
# the CLI does the printing — it opts back in at its crate root.
#
# This is enforcement, not preference: `flint init` used to own its whole
# terminal UX from inside `flint-lint`, and nothing caught it.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
# A `todo!()` reached at runtime is a panic in a linter someone is running in
# CI; `unimplemented!()` says the same thing more honestly at review time.
todo = "warn"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# serde_yaml is archived upstream (dtolnay, final release 0.9.34+deprecated).
# It is load-bearing across the workspace and YAML isn't moving; replacement
# (serde_norway / saphyr) is deferred deliberately — revisit if a CVE lands.
serde_yaml = "0.9"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
toml = "0.8"
once_cell = "1.20"
rayon = "1.10"
colored = "2.1"
semver = "1.0"
chrono = { version = "0.4", features = ["serde"] }
pathdiff = "0.2"
tempfile = "3.14"
globset = "0.4"
tokio = { version = "1.42", features = ["full", "io-std"] }
tower-lsp = "0.20"
dashmap = "5.5"
# CLI-only network/parsing deps (`flint fma` / `flint fleet`): blocking HTTP
# with rustls (no async runtime for a CLI), pull-parser for the FMA RSS feed.
ureq = { version = "2.12", features = ["json"] }
quick-xml = "0.37"
