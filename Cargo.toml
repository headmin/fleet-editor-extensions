[workspace]
resolver = "2"
members = [
    "crates/flint-lint",
    "crates/flint-lsp",
    "cli",
]
exclude = [
    "editors/zed",
    "fleet-schema-gen",
]

[workspace.package]
version = "0.2.0"
edition = "2021"

# Single source of truth for dependency versions. Member crates reference
# these with `dep = { workspace = true }` (adding crate-local features where
# needed), so versions can't silently drift apart between crates.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# serde_yaml is archived upstream (dtolnay, final release 0.9.34+deprecated).
# It is load-bearing across the workspace and YAML isn't moving; replacement
# (serde_norway / saphyr) is deferred deliberately — revisit if a CVE lands.
serde_yaml = "0.9"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
toml = "0.8"
once_cell = "1.20"
rayon = "1.10"
colored = "2.1"
semver = "1.0"
chrono = { version = "0.4", features = ["serde"] }
pathdiff = "0.2"
tempfile = "3.14"
globset = "0.4"
tokio = { version = "1.42", features = ["full", "io-std"] }
tower-lsp = "0.20"
dashmap = "5.5"
# CLI-only network/parsing deps (`flint fma` / `flint fleet`): blocking HTTP
# with rustls (no async runtime for a CLI), pull-parser for the FMA RSS feed.
ureq = { version = "2.12", features = ["json"] }
quick-xml = "0.37"
