# One compiler for every build: local, build-release.sh, CI and `cross`.
# Bump deliberately, together with `rust-version` in Cargo.toml.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
targets = [
    "aarch64-apple-darwin",
    "wasm32-wasip2",              # Zed extension
    "x86_64-unknown-linux-musl",  # release-linux.yml
    "aarch64-unknown-linux-musl",
]
profile = "minimal"
